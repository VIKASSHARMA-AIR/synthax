name: Build and Release SynthaX APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SynthaX-v1.0.0-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: SynthaX v1.0.0 Release
        body: |
          ### SynthaX v1.0.0 Official Release
          - Open-Source Android Music Player by **FURYAXL**
          - Kotlin, Jetpack Compose (Material 3), Media3 (ExoPlayer + MediaSession), Room, Hilt
          - Download `app-debug.apk` below to install directly on your Android phone!
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
